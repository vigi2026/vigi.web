<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIGI LOCK — Smart Cyber Security & Student Assistant | BCA Final-Year Project</title>
    <meta name="description" content="Official 3D Interactive Project Presentation for VIGI LOCK — Smart Cyber Security & Student Assistant (BCA VI Semester, 2026–2027)." />
    <link rel="icon" type="image/png" href="./assets/vigi-lock-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />

    <style>
      /* Instant Startup Styling - Prevents any blank/white screen flash */
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #010611;
        color: #F5FAFF;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Fallback Pre-Launch Hero Card (Replaced seamlessly once React mounts) */
      .vigi-startup-container {
        flex: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 20%, rgba(0, 245, 255, 0.12), transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(255, 184, 0, 0.08), transparent 45%),
                    #010611;
        position: relative;
        overflow: hidden;
      }
      .vigi-grid-bg {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(0, 245, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 245, 255, 0.04) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 30%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 30%, transparent 80%);
        pointer-events: none;
      }
      .vigi-startup-card {
        position: relative;
        z-index: 10;
        max-width: 580px;
        width: 100%;
        background: rgba(5, 15, 36, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 245, 255, 0.35);
        border-radius: 24px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 0 60px rgba(0, 245, 255, 0.18), inset 0 0 30px rgba(0, 245, 255, 0.05);
        animation: vigi-appear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .vigi-logo-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 24px auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .vigi-logo-glow {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 245, 255, 0.6), transparent 70%);
        animation: vigi-pulse 2.2s infinite ease-in-out;
      }
      .vigi-logo-img {
        position: relative;
        z-index: 2;
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: drop-shadow(0 0 16px rgba(0, 245, 255, 0.8));
      }
      .vigi-title {
        font-family: 'Urbanist', sans-serif;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .vigi-title span {
        color: #00F5FF;
        text-shadow: 0 0 20px rgba(0, 245, 255, 0.6);
      }
      .vigi-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background: rgba(0, 245, 255, 0.1);
        border: 1px solid rgba(0, 245, 255, 0.4);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #00F5FF;
        margin-bottom: 18px;
        text-transform: uppercase;
      }
      .vigi-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #00F5FF;
        box-shadow: 0 0 8px #00F5FF;
        animation: vigi-blink 1.2s infinite ease-in-out;
      }
      .vigi-desc {
        font-size: 14px;
        line-height: 1.6;
        color: #94A3B8;
        margin-bottom: 28px;
      }
      .vigi-progress-box {
        background: rgba(1, 6, 17, 0.8);
        border: 1px solid rgba(0, 245, 255, 0.2);
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 24px;
        text-align: left;
      }
      .vigi-progress-header {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-family: 'Fragment Mono', monospace;
        color: #00F5FF;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
      }
      .vigi-progress-track {
        width: 100%;
        height: 5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .vigi-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        background: linear-gradient(90deg, #00A8FF, #00F5FF, #FFB800);
        border-radius: 99px;
        animation: vigi-loading-anim 2s infinite ease-in-out;
      }
      .vigi-features-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .vigi-pill {
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        font-size: 11px;
        color: #CBD5E1;
      }

      @keyframes vigi-appear {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes vigi-pulse {
        0%, 100% {
          transform: scale(0.9);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.8;
        }
      }
      @keyframes vigi-blink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes vigi-loading-anim {
        0% { left: 0%; width: 15%; }
        50% { left: 35%; width: 55%; }
        100% { left: 85%; width: 15%; }
      }
    </style>
  </head>
  <body class="bg-[#010611] text-[#F5FAFF] antialiased selection:bg-neonCyan/20 selection:text-neonCyan overflow-x-hidden">
    <div id="root">
      <!-- High-tech Instant Startup Screen (Never a blank white page) -->
      <div class="vigi-startup-container">
        <div class="vigi-grid-bg"></div>

        <div class="vigi-startup-card">
          <div class="vigi-logo-wrap">
            <div class="vigi-logo-glow"></div>
            <img 
              src="./assets/vigi-lock-logo.png" 
              alt="VIGI LOCK Shield Logo" 
              class="vigi-logo-img"
              onerror="this.style.display='none'"
            />
          </div>

          <div class="vigi-badge">
            <span class="vigi-badge-dot"></span>
            BCA Final-Year Project · 2026–2027
          </div>

          <h1 class="vigi-title">
            VIGI <span>LOCK</span>
          </h1>

          <p class="vigi-desc">
            Smart Cyber Security &amp; Student Assistant — Interactive 3D Architecture, URL Scanner, Voice AI &amp; Timetable Management.
          </p>

          <div class="vigi-progress-box">
            <div class="vigi-progress-header">
              <span>INITIALIZING SYSTEM CORE</span>
              <span>DEFENSE ENGINE ONLINE</span>
            </div>
            <div class="vigi-progress-track">
              <div class="vigi-progress-bar"></div>
            </div>
          </div>

          <div class="vigi-features-pills">
            <span class="vigi-pill">🛡️ Phishing Protection</span>
            <span class="vigi-pill">⚡ 3D Holographic Model</span>
            <span class="vigi-pill">🎙️ Voice Assistant</span>
            <span class="vigi-pill">📅 Study Timetable</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
